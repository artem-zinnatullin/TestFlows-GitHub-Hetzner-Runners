name: Build & Push Docker Image

on:
  workflow_dispatch:  # Manually trigger from GitHub UI
    inputs:
      testflows_version:
        description: 'TestFlows package version (e.g. 1.10.260403.1003327)'
        required: true
        type: string
      version_tag:
        description: 'Version tag for image (e.g. 1.10.260403.1003327-fixed)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io, works in forks too and pushes to fork owner Packages.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/testflows-hetzner-runners
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version_tag }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build metadata (shows in GitHub Packages UI)
          build-args: |
            TESTFLOWS_VERSION=${{ inputs.testflows_version }}

      - name: Published Image Info
        run: |
          echo "✅ Image built & pushed to:"
          echo "   ghcr.io/${{ github.repository_owner }}/testflows-hetzner-runners:latest"
          echo "   ghcr.io/${{ github.repository_owner }}/testflows-hetzner-runners:${{ inputs.version_tag }}"
          echo ""
          echo "You can now pull it with:"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/testflows-hetzner-runners:${{ inputs.version_tag }}"
